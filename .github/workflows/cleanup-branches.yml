name: Cleanup merged branches

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-branches
  cancel-in-progress: false

jobs:
  sweep:
    name: Delete branches of merged PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sweep merged head branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          default="${DEFAULT:-main}"
          owner="${REPO%%/*}"

          open_refs=$(gh pr list --repo "$REPO" --state open --limit 200 --json headRefName --jq '.[].headRefName')
          merged=$(gh pr list --repo "$REPO" --state merged --limit 200 --json headRefName,headRepositoryOwner --jq '.[] | "\(.headRepositoryOwner.login)\t\(.headRefName)"')

          deleted=0
          skipped=0
          failed=0
          while IFS=$'\t' read -r ref_owner ref; do
            [ -n "$ref" ] || continue
            if [ "$ref_owner" != "$owner" ]; then
              continue
            fi
            if [ "$ref" = "$default" ]; then
              echo "lewati branch default: $ref"
              skipped=$((skipped + 1))
              continue
            fi
            if printf '%s\n' "$open_refs" | grep -qxF "$ref"; then
              echo "lewati (masih ada PR terbuka): $ref"
              skipped=$((skipped + 1))
              continue
            fi
            if ! gh api "repos/$REPO/git/refs/heads/$ref" >/dev/null 2>&1; then
              echo "sudah tidak ada: $ref"
              continue
            fi
            if [ "${DRY_RUN:-0}" = "1" ]; then
              echo "DRY_RUN: akan hapus $ref"
              deleted=$((deleted + 1))
              continue
            fi
            hapus=0
            for _ in 1 2 3; do
              if gh api -X DELETE "repos/$REPO/git/refs/heads/$ref" >/dev/null 2>&1; then
                hapus=1
                break
              fi
              sleep 5
            done
            if [ "$hapus" = "1" ]; then
              echo "hapus $ref"
              deleted=$((deleted + 1))
            else
              echo "::warning::gagal hapus $ref (3 percobaan) - run berikutnya mengulang"
              failed=$((failed + 1))
            fi
          done < <(printf '%s\n' "$merged" | sort -u)
          echo "selesai: $deleted dihapus, $failed gagal, $skipped dilewati"
