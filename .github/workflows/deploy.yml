name: deploy

# Production only: the PR gate lives in ci.yml. This job builds assets, applies
# companion D1 migrations, then runs `deploy --mode 3` for the D1 ensure and
# `wrangler deploy`. No separate database workflow to drift from it.
#
# dist/schema.sql is CREATE-only, generated from database/migrations. It can
# initialise an empty D1, but it cannot add tables or columns to an already
# populated, externally managed D1. Companion migrations under database/d1/
# must be applied explicitly; the step below applies them idempotently before
# deploy. `--skip-schema` stays in the deploy command because re-applying the
# CREATE-only schema there would collide with the tables already present.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, database, deploy (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Create this environment in Settings → Environments to require reviewers.
    environment: production
    env:
      # The SAME key on every deploy: a random one would invalidate every
      # encrypted cookie/session at each release. Env wins over `.env`, so no
      # `key:generate` below. It must keep its `base64:` prefix verbatim —
      # storage HMACs and the session hashKey hash the string itself.
      APP_KEY: ${{ secrets.APP_KEY }}
      # Production values win over .env (the same mechanism as APP_KEY). Without
      # these the build bakes `.env.example`'s local values into
      # dist/src/config.generated.mjs: APP_URL=http://localhost:8000 (every
      # url()/redirect/signed URL would point there) and CACHE_STORE=file (the
      # edge only builds the D1 cache when cache.driver is `database`).
      APP_ENV: production
      APP_DEBUG: 'false'
      # The public URL, kept out of this public repository and out of its logs.
      # A SECRET (not a variable): GitHub echoes every job-env value in each
      # step header; secrets are masked to *** there.
      APP_URL: ${{ secrets.APP_URL }}
      CACHE_STORE: database
      LOG_LEVEL: warning
      # Verification mail goes out over Resend from the domain verified in the
      # Resend dashboard. `resend` is baked into dist/src/config.generated.mjs
      # (mail.driver/mail.from); the API key is NOT baked — the Worker reads it at
      # request time from the secret RESEND_API_KEY (`wrangler secret put`), and a
      # missing key fails the send, not the build.
      MAIL_MAILER: resend
      MAIL_FROM_ADDRESS: noreply@nietzsc.de
      MAIL_FROM_NAME: nearFind
      # SEAL_* and NEARFIND_AUTH_* are NOT baked into the artifact (the `seal`
      # config group is not dumped) — they are Worker secrets/vars read by the
      # ports at request time. Set them once with `wrangler secret put`.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: cp .env.example .env

      - name: Build assets
        run: npm run build

      # dist/schema.sql is CREATE-only, so `deploy --mode 3` skips it on this
      # externally managed D1. The companion SQL under database/d1/ still has
      # to reach the remote database; it uses CREATE IF NOT EXISTS, so this
      # step is deterministic and safe on every deploy. The D1 name comes from
      # wrangler.jsonc, the same source of truth the deploy step reads.
      - name: Apply companion D1 schema (remote)
        run: |
          D1_NAME="$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/mg,'');process.stdout.write(JSON.parse(s).d1_databases[0].database_name)")"
          npx wrangler d1 execute "$D1_NAME" --remote --yes --file="${{ github.workspace }}/database/d1/2026_11_17_create_locations.sql"

      # No composer install: `deploy` provisions a composer-free vendor tree
      # from composer.lock (vendor-lite) — the same path the tool's e2e job
      # covers. require-dev is not provisioned, and nothing here runs PHPUnit.
      - name: Build, database, deploy (mode 3)
        run: |
          set -o pipefail
          if [ -z "${APP_URL}" ]; then
            echo "APP_URL is not set (repository variable) - refusing to bake an empty URL"; exit 2
          fi
          # CI has no lw-state.json (it is local deploy state), so the tool would
          # fall back to "<worker>-db"; the committed config already names the
          # real D1. Read its id instead of creating a second, unbindable one.
          D1_ID="$(node -e "const s=require('fs').readFileSync('wrangler.jsonc','utf8').replace(/^\s*\/\/.*$/mg,'');process.stdout.write(JSON.parse(s).d1_databases[0].database_id)")"
          echo "d1: ${D1_ID:0:8}… (from wrangler.jsonc)"
          # dist/schema.sql is CREATE-only: it can initialise an empty D1 but
          # cannot add tables or columns to this externally managed D1. The
          # companion step above handles that; skip the tool's schema step here
          # because reapplying CREATE-only SQL would collide with what exists.
          # The worker URL stays out of this public repository's logs: wrangler
          # echoes it on deploy, so the streamed copy masks it. The log file
          # keeps the raw output for the readiness block below.
          npx laravel-workers deploy --mode 3 --yes --no-cache --d1-id "$D1_ID" --skip-schema 2>&1 \
            | tee deploy.log \
            | sed -E 's#https?://[A-Za-z0-9._-]+\.workers\.dev#https://<worker>.workers.dev#g'

      # The same reporter as the PR gate, not a second, hand-rolled one: the
      # action reads the READINESS block out of the log and writes the job
      # summary (carrying the project mark). On a push there is no pull request,
      # so `comment: 'false'` states that this surface is the summary only.
      # `GITHUB_STEP_SUMMARY` is written unconditionally, so `if: always()` is
      # what keeps the summary alive when the deploy itself fails.
      - name: Verdict — readiness
        if: always()
        uses: arfoux/laravel-workers/action/verdict@9b329c0453cf26aa9f525c9fa2f67ff85c57a279
        with:
          log: deploy.log
          comment: 'false'
