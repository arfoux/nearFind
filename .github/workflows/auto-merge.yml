name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  actions: write # memicu ulang CI setelah branch disinkronkan
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    name: Arm auto-merge (squash)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Guard - PR yang mengubah workflow tidak di-arm
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          if gh pr view "$PR" --json files --jq '.files[].path' | grep -q '^\.github/workflows/'; then
            echo "PR menyentuh .github/workflows/ - tidak di-arm, tunggu review manusia."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Arm auto-merge
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"

      - name: Tunggu merge lalu hapus branch head
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "PR dari fork - branch bukan milik repo ini, dilewati."
            exit 0
          fi
          if [ "$REF" = "$DEFAULT" ]; then
            echo "Branch default, dilewati."
            exit 0
          fi

          state=""
          sync=0
          i=0
          for _ in $(seq 1 120); do
            i=$((i + 1))
            state=$(gh pr view "$PR" --json state --jq .state) || state=""
            if [ "$state" = "MERGED" ]; then
              break
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "PR ditutup tanpa merge - branch dibiarkan."
              exit 0
            fi
            # Branch protection mensyaratkan "up to date", dan auto-merge tidak menyentuh
            # branch sama sekali - ia cuma menunggu. Tanpa sinkronisasi, PR yang ketinggalan
            # main mentok sampai poll menyerah. Jadi sinkronkan sendiri (maks 5x), lalu picu
            # ulang CI: push oleh GITHUB_TOKEN tidak membuat workflow run baru, dan commit
            # merge itu butuh status "Lint, test, and build" sendiri.
            if [ "$sync" -lt 5 ] && [ $((i % 4)) -eq 1 ]; then
              status=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus) || status=""
              if [ "$status" = "BEHIND" ]; then
                sync=$((sync + 1))
                if gh pr update-branch "$PR" >/dev/null 2>&1; then
                  echo "Branch ketinggalan $DEFAULT - disinkronkan [$sync/5], CI dipicu ulang."
                  gh workflow run ci.yml --ref "$REF" >/dev/null 2>&1 || echo "::warning::Gagal memicu CI - merge menunggu status."
                else
                  echo "::warning::Branch ketinggalan tapi update-branch gagal (konflik?) - menunggu."
                fi
              fi
            fi
            sleep 15
          done

          if [ "$state" != "MERGED" ]; then
            echo "::warning::Belum merge setelah 30 menit - sisa branch diserahkan ke cleanup-branches.yml."
            exit 0
          fi

          hapus=0
          for _ in 1 2 3; do
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$REF" >/dev/null 2>&1; then
              hapus=1
              break
            fi
            sleep 5
          done
          if [ "$hapus" = "1" ]; then
            echo "branch $REF terhapus."
          else
            echo "::warning::Gagal hapus $REF (3 percobaan) - cleanup-branches.yml akan mencoba lagi."
          fi
