version: 2
# One PR per ecosystem, weekly. Ungrouped, a first run opened six at once and
# every merge to main triggers a deploy; grouping keeps the queue readable and
# the edge gate still verifies each bump.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # laravel-workers is pinned exactly and bumped by PR, so the edge gate
    # verifies every tool upgrade before it can reach a deploy.
    groups:
      npm-prod:
        dependency-type: production
      npm-dev:
        dependency-type: development

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      # Prod and dev are separate PRs: one failing dev bump (e.g. a PHPUnit
      # major that needs another PHP) must not hold the runtime bump hostage.
      composer-prod:
        dependency-type: production
      composer-dev:
        dependency-type: development
    ignore:
      # PHPUnit 13 needs PHP >= 8.4; the app's CI (and the build) runs 8.3,
      # so the bump can only fail on install. Revisit when the runtime moves.
      - dependency-name: phpunit/phpunit
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
