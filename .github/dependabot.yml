version: 2
# One PR per ecosystem, weekly. Ungrouped, a first run opened six at once and
# every merge to main triggers a deploy; grouping keeps the queue readable and
# the edge gate still verifies each bump.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # laravel-workers is pinned exactly and bumped by PR, so the edge gate
    # verifies every tool upgrade before it can reach a deploy.
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
